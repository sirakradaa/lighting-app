<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lights</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <p class="eyebrow">KS Light and LED LAMP</p>
        <h1>Lights</h1>
      </div>
      <p class="lede">Your computer talks to the lamps over Bluetooth. Close those phone apps first — a lamp only accepts one connection.</p>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div class="layout">
      <aside>
        <div class="aside-bar">
          <button id="scan-btn" class="primary" type="button">Scan</button>
          <button id="all-btn" class="ghost" type="button">All connected</button>
        </div>
        <label class="checkline"><input id="show-all" type="checkbox"> Show other Bluetooth devices</label>
        <div id="light-list" class="light-list"></div>
      </aside>
      <main id="stage"></main>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
